<!doctype html><html lang="ro"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0c11"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Cinematic AI">
<link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/icons/icon-192.png"><link rel="stylesheet" href="/style.css"><title>Cinematic AI Studio</title></head><body>
<main class="app"><header><div><h1>Cinematic AI <small style="font-size:12px;opacity:.55">v4.1</small></h1><p>Studio AI pentru iPhone · TikTok · Reels</p></div><span id="aiBadge" class="badge">Verific AI…</span></header>
<section class="card primary">
  <div class="steps"><span>1 Poză</span><span>2 Spui ce vrei</span><span>3 Generezi</span></div>
  <label>Încarcă poza</label><input id="imageInput" type="file" accept="image/*"><div id="imageName" class="muted">Nicio poză selectată</div>
  <label>🤖 Ce vrei să facă robotul?</label><textarea id="prompt">Băiatul să rămână complet nemișcat. Camera să se ridice foarte ușor, zoom lent, norii să se miște încet și apa să aibă reflexii naturale. Cinematic, realist. 10 secunde.</textarea>
  <label>✍️ Citat separat <small>(opțional, recomandat)</small></label><textarea id="quote" class="quote" placeholder="Pune citatul aici ca să rămână perfect neschimbat."></textarea>
  <div class="row three"><div><label>Mod</label><select id="mode"><option value="ai" selected>AI Motion</option><option value="safe">Safe Motion</option></select></div><div><label>FPS</label><select id="fps"><option value="30">30 FPS</option><option value="60" selected>60 FPS</option></select></div><div><label>Durată</label><select id="duration"><option value="5">5 sec</option><option value="8">8 sec</option><option value="10" selected>10 sec</option><option value="12">12 sec</option><option value="15">15 sec</option></select></div></div>
  <details><summary>Setări avansate</summary><div class="row"><div><label>Model AI</label><select id="model"><option value="kling">Kling 3</option><option value="pika">Pika 2.2</option></select></div><div><label>Calitate</label><select id="resolution"><option value="720p" selected>720p rapid</option><option value="1080p">1080p</option></select></div></div><label class="check"><input id="audioToggle" type="checkbox"> Audio AI, dacă modelul îl suportă</label><div class="row"><div><label>Poziție citat</label><select id="quoteY"><option value="0.28">Sus</option><option value="0.46" selected>Mijloc</option><option value="0.68">Jos</option></select></div><div><label>Mărime</label><select id="quoteSize"><option value="34">Mic</option><option value="42" selected>Mediu</option><option value="50">Mare</option></select></div></div></details>
  <button id="generateBtn" class="big" disabled>✨ Generează videoclipul</button>
  <div id="chips" class="chips"></div><div id="status" class="status"></div>
</section>
<section class="card"><div class="stage"><canvas id="canvas" width="540" height="960"></canvas><video id="aiVideo" playsinline controls loop hidden></video></div><div class="actions"><button id="previewBtn" class="secondary" disabled>▶️ Preview</button><button id="exportBtn" class="secondary" disabled>⬇️ Exportă cu citat</button><a id="directSave" class="button secondary" hidden>⬇️ Salvează video AI</a></div><p class="hint">60 FPS: Safe Motion rulează direct la 60 FPS. Pentru AI Motion, serverul încearcă să netezească rezultatul la 60 FPS prin interpolare.</p></section>
</main><script src="/app.js"></script></body></html>
